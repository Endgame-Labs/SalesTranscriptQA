[project]
name = "salestranscriptqa"
version = "0.1.0"
description = "Dialogue RAG benchmark generation and dataset CLI"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kyle Wild"}]
dependencies = ["httpx>=0.28,<1", "pyarrow>=19", "PyYAML>=6", "typer>=0.16,<1", "scikit-learn>=1.6", "huggingface-hub>=0.30,<2"]

[project.scripts]
salestranscriptqa = "salestranscriptqa.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
